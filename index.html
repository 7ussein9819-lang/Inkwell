<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inkwell — Question Paper Builder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inkwell">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-0:#eef1f8; --bg-1:#ffffff; --bg-2:#f6f8fc; --bg-3:#e6ebf3;
  --text-1:#0a1020; --text-2:#475569; --text-3:#94a3b8;
  --border:#e3e8f0; --border-strong:#cad2df;
  --accent:#0d9488; --accent-hover:#0f766e;
  --accent-light:#f0fdfa; --accent-ring:rgba(13,148,136,.18);
  --accent-glow:rgba(13,148,136,.32);
  --success:#10b981; --danger:#ef4444; --danger-light:#fee2e2;
  --warning:#f59e0b;
  --shadow-xs:0 1px 2px rgba(11,18,32,.04);
  --shadow-sm:0 1px 3px rgba(11,18,32,.05),0 1px 2px rgba(11,18,32,.03);
  --shadow:0 4px 16px rgba(11,18,32,.07);
  --shadow-lg:0 16px 40px rgba(11,18,32,.13);
  --shadow-paper:0 12px 48px rgba(11,18,32,.15);
  --radius-sm:10px; --radius:14px; --radius-lg:18px;
  --nav-h:68px; --topbar-h:60px;
  --font:"Arial","Segoe UI","Tahoma",sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-bounce:cubic-bezier(.68,-.55,.27,1.55);
}
html[data-theme="dark"]{
  --bg-0:#060a14; --bg-1:#0d1526; --bg-2:#182135; --bg-3:#273147;
  --text-1:#f1f5f9; --text-2:#cbd5e1; --text-3:#64748b;
  --border:#1a2338; --border-strong:#2f3a52;
  --accent:#14b8a6; --accent-hover:#0d9488;
  --accent-light:#042f2e; --accent-ring:rgba(20,184,166,.24);
  --accent-glow:rgba(20,184,166,.4);
  --danger-light:#7f1d1d;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.5);
  --shadow:0 4px 16px rgba(0,0,0,.45);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --shadow-paper:0 12px 48px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;transition:background-color .3s var(--ease),color .3s var(--ease);}
body{
  background:var(--bg-0);color:var(--text-1);
  font-family:var(--font);font-size:14px;min-height:100vh;
  padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit;}

/* ============ Animations ============ */
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@keyframes ripple{to{transform:scale(4);opacity:0;}}

/* ============ Topbar ============ */
.topbar{
  position:sticky;top:0;z-index:100;
  background:color-mix(in srgb, var(--bg-1) 85%, transparent);
  border-bottom:1px solid var(--border);height:var(--topbar-h);
  padding:0 12px;display:flex;align-items:center;gap:8px;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  animation:slideDown .4s var(--ease);
}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0;}
.brand-icon{
  width:36px;height:36px;flex:0 0 36px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:0 4px 14px var(--accent-glow);
  transition:transform .3s var(--ease-bounce);
}
.brand-icon:hover{transform:scale(1.1) rotate(-8deg);}
.brand-text{min-width:0;}
.brand-text b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-text small{display:block;font-size:11px;color:var(--text-3);font-weight:500;margin-top:1px;}
.tg-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:20px;
  background:linear-gradient(135deg,#229ED9,#1a7bb0);
  color:#fff;font-size:10px;font-weight:700;
  text-decoration:none;flex:0 0 auto;letter-spacing:.2px;margin-inline-end:4px;
  box-shadow:0 2px 8px rgba(34,158,217,.35);
  transition:all .3s var(--ease-bounce);
}
.tg-badge:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 6px 16px rgba(34,158,217,.5);}
.tg-badge svg{width:11px;height:11px;fill:#fff;}
@media (max-width:420px){.tg-badge span{display:none;}.tg-badge{padding:5px;}}
.topbar-actions{display:flex;gap:6px;align-items:center;}
.icon-btn{
  width:38px;height:38px;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 auto;padding:0;transition:all .2s var(--ease);
  position:relative;overflow:hidden;
}
.icon-btn:hover{background:var(--bg-2);color:var(--accent);border-color:var(--border);transform:translateY(-2px);}
.icon-btn:active{transform:scale(.9);}
.icon-btn svg{width:20px;height:20px;display:block;transition:transform .2s var(--ease);}
.icon-btn:hover svg{transform:scale(1.1);}
html[data-theme="light"] .icon-btn .icon-dark{display:none;}
html[data-theme="dark"] .icon-btn .icon-light{display:none;}

.auth-btn.logged-in{color:var(--success);}
.auth-btn.logged-in::after{
  content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;
  background:var(--success);border-radius:50%;
  box-shadow:0 0 0 2px var(--bg-1);
  animation:pulse 2s infinite;
}

.menu-wrap{position:relative;}
.menu{
  position:absolute;top:calc(100% + 8px);left:0;
  background:var(--bg-1);color:var(--text-1);min-width:230px;
  border-radius:var(--radius);box-shadow:var(--shadow-lg);
  border:1px solid var(--border);padding:6px;display:none;z-index:200;
}
.menu.open{display:block;animation:scaleIn .2s var(--ease-bounce);transform-origin:top left;}
.menu button{
  width:100%;text-align:right;border:none;background:transparent;
  padding:11px 12px;border-radius:9px;font-size:13px;font-weight:500;
  cursor:pointer;color:var(--text-1);display:flex;align-items:center;gap:10px;
  transition:all .15s var(--ease);
}
.menu button:hover{background:var(--bg-2);transform:translateX(-4px);}
.menu button.danger{color:var(--danger);}
.menu hr{border:none;border-top:1px solid var(--border);margin:4px 0;}
.menu .mi{font-size:16px;width:20px;text-align:center;display:inline-flex;align-items:center;justify-content:center;}

main{padding:14px 10px;max-width:100%;overflow-x:hidden;}
.view{display:none;}
.view.active{display:block;animation:fadeInUp .4s var(--ease);}

/* ============ Bottom nav ============ */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;
  background:color-mix(in srgb, var(--bg-1) 92%, transparent);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;align-items:stretch;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  z-index:150;backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  min-height:var(--nav-h);
}
.navbtn{
  flex:1;border:none;background:transparent;color:var(--text-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:8px 4px;border-radius:12px;cursor:pointer;
  font-size:11px;font-weight:700;min-width:0;position:relative;
  transition:all .25s var(--ease);
}
.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;transition:all .3s var(--ease-bounce);}
.navbtn:hover{color:var(--accent);}
.navbtn:hover svg{transform:scale(1.15) translateY(-2px);}
.navbtn.active{color:var(--accent);}
.navbtn.active svg{transform:scale(1.1);}
.navbtn.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:36px;height:3px;background:var(--accent);border-radius:0 0 3px 3px;
  animation:slideDown .3s var(--ease-bounce);
}
@media (min-width:900px){
  .bottomnav{max-width:760px;margin:0 auto;left:50%;transform:translateX(-50%);right:auto;border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;}
}

/* ============ Preview / Paper ============ */
.preview-outer{position:relative;}
.preview-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:10px 0;overflow-x:auto;scrollbar-width:thin;}
.page-scaler{position:relative;flex:0 0 auto;animation:fadeInUp .5s var(--ease);}
.page{
  width:210mm;height:297mm;background:#ffffff;color:#111827;
  padding:8mm 12mm 12mm;
  position:absolute;top:0;left:0;
  transform-origin:top right;box-shadow:var(--shadow-paper);
  display:flex;flex-direction:column;font-size:12pt;line-height:1.5;overflow:hidden;
  transition:box-shadow .3s var(--ease);
}
.page:hover{box-shadow:0 16px 60px rgba(11,18,32,.2);}
.page-frame{position:absolute;inset:5mm;pointer-events:none;z-index:3;}
.page-frame.frame-none{display:none;}
.page-frame.frame-solid{border:1.5px solid var(--frame-c,#000);}
.page-frame.frame-double{border:4px double var(--frame-c,#000);}
.page-frame.frame-dashed{border:2px dashed var(--frame-c,#000);}
.page-frame.frame-dotted{border:2px dotted var(--frame-c,#000);}
.page-frame.frame-thick{border:5px solid var(--frame-c,#000);}
.page-frame.frame-elegant{border:1px solid var(--frame-c,#000);outline:3px solid var(--frame-c,#000);outline-offset:3px;}
.page-frame.frame-rounded{border:2px solid var(--frame-c,#000);border-radius:12px;}
.page-frame.frame-double-thin{border:1px solid var(--frame-c,#000);box-shadow:inset 0 0 0 4px transparent, inset 0 0 0 5px var(--frame-c,#000);}
.page-frame.frame-ornate::before,.page-frame.frame-ornate::after{content:'';position:absolute;inset:0;border:3px solid var(--frame-c,#000);}
.page-frame.frame-ornate::before{inset:6px;border-width:1px;}
.page-frame.frame-triple{border:1px solid var(--frame-c,#000);box-shadow:0 0 0 3px transparent,0 0 0 4px var(--frame-c,#000),0 0 0 7px transparent,0 0 0 8px var(--frame-c,#000);}
.page-frame.frame-corners{background:linear-gradient(var(--frame-c),var(--frame-c)) top right/30px 2px no-repeat,linear-gradient(var(--frame-c),var(--frame-c)) top right/2px 30px no-repeat,linear-gradient(var(--frame-c),var(--frame-c)) top left/30px 2px no-repeat,linear-gradient(var(--frame-c),var(--frame-c)) top left/2px 30px no-repeat,linear-gradient(var(--frame-c),var(--frame-c)) bottom right/30px 2px no-repeat,linear-gradient(var(--frame-c),var(--frame-c)) bottom right/2px 30px no-repeat,linear-gradient(var(--frame-c),var(--frame-c)) bottom left/30px 2px no-repeat,linear-gradient(var(--frame-c),var(--frame-c)) bottom left/2px 30px no-repeat;}
.page-frame.frame-thin-solid{border:0.5px solid var(--frame-c,#000);}
.page-frame.frame-thin-double{border:1px solid var(--frame-c,#000);box-shadow:inset 0 0 0 2px transparent, inset 0 0 0 3px var(--frame-c,#000);}
.page-frame.frame-top-bottom{border-top:3px solid var(--frame-c,#000);border-bottom:3px solid var(--frame-c,#000);}
.page-frame.frame-left-right{border-left:3px solid var(--frame-c,#000);border-right:3px solid var(--frame-c,#000);}

.page-content{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;min-height:0;}
.page-main{flex:1;min-height:0;}
.watermark{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;}
.watermark-text{font-weight:bold;white-space:nowrap;}
.watermark-img{max-width:80%;max-height:80%;object-fit:contain;}

.zoom-ctrl{position:fixed;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));left:16px;z-index:99;display:flex;align-items:center;gap:4px;background:var(--bg-1);border:1px solid var(--border);border-radius:30px;padding:4px;box-shadow:var(--shadow-lg);animation:fadeInUp .5s var(--ease) .2s backwards;}
.zoom-ctrl button{width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;font-weight:700;padding:0;transition:all .2s var(--ease-bounce);}
.zoom-ctrl button:hover{background:var(--accent-light);color:var(--accent);transform:scale(1.15);}
.zoom-ctrl button:active{transform:scale(.9);}
.zoom-ctrl .pct{font-size:12px;font-weight:800;min-width:44px;text-align:center;color:var(--text-1);padding:0 4px;}
@media print{.zoom-ctrl{display:none !important;}}

.page-header{margin-bottom:3px;}
.header-grid{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:6px;align-items:start;}
.hcol{display:flex;flex-direction:column;gap:1px;min-width:0;}
.hcol-right{text-align:right;align-items:flex-end;}
.hcol-center{text-align:center;align-items:center;}
.hcol-left{text-align:left;align-items:flex-start;}
.hfield{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.25;width:100%;}
.hcol-right .hfield{text-align:right;}
.hcol-center .hfield{text-align:center;}
.hcol-left .hfield{text-align:left;}
.header-extra{text-align:center;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.25;}
.header-line{margin:4px 0 3px 0;}
.header-note{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:4px;line-height:1.4;}

.q-item{margin-bottom:6px;overflow-wrap:anywhere;page-break-inside:avoid;break-inside:avoid;}
.q-head-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:1px;flex-wrap:nowrap;}
.q-title-el{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;}
.q-points-el{flex:0 0 auto;white-space:nowrap;}
.q-desc-el{white-space:normal;overflow-wrap:anywhere;}
.q-desc-el p{margin:0 0 3px;}
.q-desc-el strong{font-weight:900;}
.q-desc-el em{font-style:italic;}
.q-desc-el u{text-decoration:underline;}
.q-desc-el s{text-decoration:line-through;opacity:.7;}
.q-image{display:block;margin-top:5px;max-width:60%;max-height:55mm;object-fit:contain;border-radius:4px;}

.ans-item{margin-bottom:8px;overflow-wrap:anywhere;page-break-inside:avoid;break-inside:avoid;}
.ans-title{font-weight:bold;margin-bottom:2px;overflow-wrap:anywhere;}
.ans-text{white-space:pre-wrap;overflow-wrap:anywhere;}

.math-frac{display:inline-flex;flex-direction:column;vertical-align:-0.55em;text-align:center;font-size:0.9em;line-height:1.05;margin:0 3px;}
.math-frac .mf-num{border-bottom:1.4px solid currentColor;padding:0 5px;}
.math-frac .mf-den{padding:0 5px;}
.math-root{display:inline-flex;align-items:flex-start;vertical-align:-0.15em;margin:0 2px;}
.math-root .mr-sym{font-size:1.25em;line-height:1;}
.math-root .mr-content{border-top:1.4px solid currentColor;padding:1px 5px 0 3px;margin-top:0.1em;min-width:14px;}
.math-matrix{display:inline-table;vertical-align:middle;margin:2px 4px;padding:2px 6px;position:relative;}
.math-matrix::before,.math-matrix::after{content:'';position:absolute;top:0;bottom:0;width:5px;border:1.5px solid currentColor;}
.math-matrix::before{left:0;border-left:none;border-radius:0 3px 3px 0;}
.math-matrix::after{right:0;border-right:none;border-radius:3px 0 0 3px;}
.math-matrix table{border-collapse:separate;border-spacing:8px 2px;}
.math-matrix td{text-align:center;min-width:16px;padding:1px 4px;}
.math-lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.05;}
.math-lim .ml-lim{font-size:0.8em;font-style:italic;}
.math-lim .ml-sub{font-size:0.6em;margin-top:-2px;}

.shape-block{position:relative;display:inline-block;vertical-align:middle;margin:6px 4px;user-select:none;-webkit-user-select:none;transition:box-shadow .15s;max-width:100%;}
.shape-block svg{display:block;width:100%;height:100%;pointer-events:none;}
.shape-block[data-float="inline"]{display:inline-block;margin:6px 4px;float:none;}
.shape-block[data-float="left"]{display:block !important;float:none !important;margin:8px auto 8px 0 !important;}
.shape-block[data-float="center"]{display:block !important;float:none !important;margin:8px auto !important;}
.shape-block[data-float="right"]{display:block !important;float:none !important;margin:8px 0 8px auto !important;}
.shape-block.selected{box-shadow:0 0 0 2px var(--accent);border-radius:3px;}
.shape-lbl{position:absolute;text-align:center;font-family:inherit;color:inherit;font-weight:bold;padding:0;line-height:1.1;box-sizing:border-box;}
input.shape-lbl{background:rgba(255,255,255,.85);border:1px dashed rgba(13,148,136,.55);border-radius:3px;outline:none;width:30px;height:16px;padding:0 2px;font-size:11px;-webkit-appearance:none;appearance:none;}
input.shape-lbl::placeholder{color:rgba(0,0,0,.25);font-size:9px;}
input.shape-lbl:focus{border-color:var(--accent);border-style:solid;background:#fff;z-index:5;box-shadow:0 0 0 2px var(--accent-ring);}
.q-desc-el .shape-lbl{background:transparent;border:none;color:inherit;}

.content-table{border-collapse:collapse;margin:6px 0;width:100%;font-family:inherit;font-size:0.95em;}
.content-table td,.content-table th{border:1px solid currentColor;padding:4px 8px;text-align:center;min-width:30px;}
.content-table th{font-weight:bold;background:rgba(13,148,136,.06);}

.page-footer{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:4px;}
.footer-wish{text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;}
.footer-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;}
.footer-grid .fcol{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;}
.footer-grid .fcol.right{text-align:right;}
.footer-grid .fcol.center{text-align:center;}
.footer-grid .fcol.left{text-align:left;}
.footer-teachers{display:flex;flex-direction:column;gap:1px;}
