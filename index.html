<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inkwell — Question Paper Builder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inkwell">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* ============================================================
   Inkwell — Modern Design System
   ============================================================ */
:root{
  --bg-0:#eef2f9;
  --bg-1:#ffffff;
  --bg-2:#f7f9fc;
  --bg-3:#e4eaf3;
  --glass:rgba(255,255,255,.72);
  --text-1:#0a1020;
  --text-2:#475569;
  --text-3:#94a3b8;
  --border:#e5eaf2;
  --border-strong:#cbd5e1;
  --accent:#0d9488;
  --accent-hover:#0f766e;
  --accent-light:#f0fdfa;
  --accent-ring:rgba(13,148,136,.18);
  --accent-glow:rgba(13,148,136,.32);
  --accent-gradient:linear-gradient(135deg,#0d9488,#14b8a6);
  --success:#10b981;
  --success-light:#d1fae5;
  --danger:#ef4444;
  --danger-light:#fee2e2;
  --warning:#f59e0b;
  --warning-light:#fef3c7;
  --shadow-xs:0 1px 2px rgba(11,18,32,.04);
  --shadow-sm:0 1px 3px rgba(11,18,32,.06),0 1px 2px rgba(11,18,32,.04);
  --shadow:0 4px 16px rgba(11,18,32,.08);
  --shadow-md:0 8px 24px rgba(11,18,32,.10);
  --shadow-lg:0 16px 40px rgba(11,18,32,.14);
  --shadow-xl:0 24px 60px rgba(11,18,32,.18);
  --shadow-paper:0 14px 50px rgba(11,18,32,.16);
  --radius-sm:10px;
  --radius:14px;
  --radius-lg:20px;
  --radius-xl:26px;
  --nav-h:68px;
  --topbar-h:62px;
  --font:"Arial","Segoe UI","Tahoma",sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-bounce:cubic-bezier(.68,-.55,.27,1.55);
  --ease-smooth:cubic-bezier(.25,.8,.25,1);
}
html[data-theme="dark"]{
  --bg-0:#050810;
  --bg-1:#0d1526;
  --bg-2:#182135;
  --bg-3:#273147;
  --glass:rgba(13,21,38,.72);
  --text-1:#f1f5f9;
  --text-2:#cbd5e1;
  --text-3:#64748b;
  --border:#1a2338;
  --border-strong:#2f3a52;
  --accent:#14b8a6;
  --accent-hover:#0d9488;
  --accent-light:#042f2e;
  --accent-ring:rgba(20,184,166,.24);
  --accent-glow:rgba(20,184,166,.45);
  --accent-gradient:linear-gradient(135deg,#14b8a6,#0d9488);
  --success-light:#064e3b;
  --danger-light:#7f1d1d;
  --warning-light:#78350f;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.5);
  --shadow:0 4px 16px rgba(0,0,0,.45);
  --shadow-md:0 8px 24px rgba(0,0,0,.5);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --shadow-xl:0 24px 60px rgba(0,0,0,.65);
  --shadow-paper:0 14px 50px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;transition:background-color .3s var(--ease),color .3s var(--ease);}
body{
  background:var(--bg-0);color:var(--text-1);
  font-family:var(--font);font-size:14px;min-height:100vh;
  padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font-family:inherit;color:inherit;}

/* ============================================================
   Animations
   ============================================================ */
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-24px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.92);}
  to{opacity:1;transform:scale(1);}
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%,60%{transform:translateX(-6px);}
  40%,80%{transform:translateX(6px);}
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.06);opacity:.85;}
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}
@keyframes ripple{
  to{transform:scale(4);opacity:0;}
}
@keyframes spinSlow{
  to{transform:rotate(360deg);}
}
@keyframes shimmer{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 0 var(--accent-glow);}
  50%{box-shadow:0 0 0 12px transparent;}
}
@keyframes bounceIn{
  0%{opacity:0;transform:scale(.3);}
  50%{opacity:1;transform:scale(1.05);}
  70%{transform:scale(.95);}
  100%{transform:scale(1);}
}
@keyframes slideInRight{
  from{opacity:0;transform:translateX(30px);}
  to{opacity:1;transform:translateX(0);}
}

/* ============================================================
   Topbar — Modern Glass
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--glass);
  border-bottom:1px solid var(--border);
  height:var(--topbar-h);
  padding:0 14px;
  display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  animation:slideDown .45s var(--ease);
}
.brand{
  display:flex;align-items:center;gap:11px;
  margin-inline-end:auto;min-width:0;
}
.brand-icon{
  width:38px;height:38px;flex:0 0 38px;
  border-radius:12px;
  background:var(--accent-gradient);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
  box-shadow:0 6px 18px var(--accent-glow);
  transition:transform .35s var(--ease-bounce);
}
.brand-icon:hover{
  transform:scale(1.1) rotate(-8deg);
}
.brand-text{min-width:0;}
.brand-text b{
  display:block;font-size:14px;font-weight:800;
  letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-text small{
  display:block;font-size:11px;color:var(--text-3);
  font-weight:500;margin-top:1px;
}
.tg-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;
  border-radius:20px;
  background:linear-gradient(135deg,#229ED9,#1a7bb0);
  color:#fff;font-size:10.5px;font-weight:700;
  text-decoration:none;flex:0 0 auto;
  letter-spacing:.2px;
  margin-inline-end:4px;
  box-shadow:0 3px 10px rgba(34,158,217,.4);
  transition:all .3s var(--ease-bounce);
}
.tg-badge:hover{
  transform:translateY(-2px) scale(1.05);
  box-shadow:0 6px 18px rgba(34,158,217,.55);
}
.tg-badge svg{width:12px;height:12px;fill:#fff;}
@media (max-width:420px){
  .tg-badge span{display:none;}
  .tg-badge{padding:6px;}
}
.topbar-actions{
  display:flex;gap:6px;align-items:center;
}
.icon-btn{
  width:38px;height:38px;
  border:1px solid transparent;
  border-radius:11px;
  background:transparent;
  color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 auto;
  padding:0;
  transition:all .25s var(--ease);
  position:relative;overflow:hidden;
}
.icon-btn:hover{
  background:var(--bg-2);
  color:var(--accent);
  border-color:var(--border);
  transform:translateY(-2px);
}
.icon-btn:active{transform:scale(.9);}
.icon-btn svg{
  width:20px;height:20px;display:block;
  transition:transform .25s var(--ease);
}
.icon-btn:hover svg{transform:scale(1.1);}
html[data-theme="light"] .icon-btn .icon-dark{display:none;}
html[data-theme="dark"] .icon-btn .icon-light{display:none;}

/* Auth button state */
.auth-btn.logged-in{color:var(--success);}
.auth-btn.logged-in::after{
  content:'';
  position:absolute;top:7px;right:7px;
  width:8px;height:8px;
  background:var(--success);
  border-radius:50%;
  box-shadow:0 0 0 2px var(--bg-1);
  animation:pulse 2s infinite;
}

/* ============================================================
   Menu dropdown
   ============================================================ */
.menu-wrap{position:relative;}
.menu{
  position:absolute;
  top:calc(100% + 10px);left:0;
  background:var(--bg-1);
  color:var(--text-1);
  min-width:240px;
  border-radius:var(--radius);
  box-shadow:var(--shadow-xl);
  border:1px solid var(--border);
  padding:6px;
  display:none;z-index:200;
}
.menu.open{
  display:block;
  animation:scaleIn .22s var(--ease-bounce);
  transform-origin:top left;
}
.menu button{
  width:100%;text-align:right;
  border:none;background:transparent;
  padding:11px 13px;
  border-radius:9px;
  font-size:13px;font-weight:500;
  cursor:pointer;color:var(--text-1);
  display:flex;align-items:center;gap:11px;
  transition:all .18s var(--ease);
}
.menu button:hover{
  background:var(--bg-2);
  transform:translateX(-4px);
}
.menu button.danger{color:var(--danger);}
.menu button.danger:hover{background:var(--danger-light);}
.menu hr{
  border:none;
  border-top:1px solid var(--border);
  margin:5px 0;
}
.menu .mi{
  font-size:16px;width:20px;
  text-align:center;
  display:inline-flex;
  align-items:center;justify-content:center;
}

/* ============================================================
   Main content
   ============================================================ */
main{
  padding:16px 12px;
  max-width:100%;
  overflow-x:hidden;
}
.view{display:none;}
.view.active{
  display:block;
  animation:fadeInUp .45s var(--ease);
}

/* ============================================================
   Bottom Navigation — Modern
   ============================================================ */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--glass);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;align-items:stretch;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  z-index:150;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  min-height:var(--nav-h);
}
.navbtn{
  flex:1;
  border:none;background:transparent;
  color:var(--text-3);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:5px;
  padding:8px 4px;
  border-radius:12px;
  cursor:pointer;
  font-size:11px;font-weight:700;
  min-width:0;position:relative;
  transition:all .28s var(--ease);
}
.navbtn svg{
  width:22px;height:22px;
  stroke:currentColor;fill:none;
  transition:all .32s var(--ease-bounce);
}
.navbtn:hover{color:var(--accent);}
.navbtn:hover svg{
  transform:scale(1.15) translateY(-2px);
}
.navbtn.active{color:var(--accent);}
.navbtn.active svg{transform:scale(1.1);}
.navbtn.active::before{
  content:'';
  position:absolute;top:0;left:50%;
  transform:translateX(-50%);
  width:36px;height:3px;
  background:var(--accent-gradient);
  border-radius:0 0 3px 3px;
  animation:slideDown .3s var(--ease-bounce);
}
@media (min-width:900px){
  .bottomnav{
    max-width:780px;margin:0 auto;
    left:50%;transform:translateX(-50%);
    right:auto;
    border-radius:22px 22px 0 0;
    border:1px solid var(--border);
    border-bottom:none;
  }
}

/* ============================================================
   Preview Area
   ============================================================ */
.preview-outer{position:relative;}
.preview-wrap{
  display:flex;flex-direction:column;
  align-items:center;gap:22px;
  padding:10px 0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.page-scaler{
  position:relative;flex:0 0 auto;
  animation:fadeInUp .55s var(--ease);
}

/* A4 Paper */
.page{
  width:210mm;height:297mm;
  background:#ffffff;
  color:#111827;
  padding:8mm 12mm 12mm;
  position:absolute;top:0;left:0;
  transform-origin:top right;
  box-shadow:var(--shadow-paper);
  display:flex;flex-direction:column;
  font-size:12pt;line-height:1.5;
  overflow:hidden;
  transition:box-shadow .35s var(--ease);
  border-radius:2px;
}
.page:hover{
  box-shadow:0 20px 70px rgba(11,18,32,.22);
}

/* ============================================================
   Frames — 16 different styles
   ============================================================ */
.page-frame{
  position:absolute;inset:5mm;
  pointer-events:none;z-index:3;
}
.page-frame.frame-none{display:none;}
.page-frame.frame-solid{
  border:1.5px solid var(--frame-c,#000);
}
.page-frame.frame-double{
  border:4px double var(--frame-c,#000);
}
.page-frame.frame-dashed{
  border:2px dashed var(--frame-c,#000);
}
.page-frame.frame-dotted{
  border:2px dotted var(--frame-c,#000);
}
.page-frame.frame-thick{
  border:5px solid var(--frame-c,#000);
}
.page-frame.frame-elegant{
  border:1px solid var(--frame-c,#000);
  outline:3px solid var(--frame-c,#000);
  outline-offset:3px;
}
.page-frame.frame-rounded{
  border:2px solid var(--frame-c,#000);
  border-radius:14px;
}
.page-frame.frame-double-thin{
  border:1px solid var(--frame-c,#000);
  box-shadow:
    inset 0 0 0 4px transparent,
    inset 0 0 0 5px var(--frame-c,#000);
}
.page-frame.frame-ornate::before,
.page-frame.frame-ornate::after{
  content:'';
  position:absolute;inset:0;
  border:3px solid var(--frame-c,#000);
}
.page-frame.frame-ornate::before{
  inset:6px;border-width:1px;
}
.page-frame.frame-triple{
  border:1px solid var(--frame-c,#000);
  box-shadow:
    0 0 0 3px transparent,
    0 0 0 4px var(--frame-c,#000),
    0 0 0 7px transparent,
    0 0 0 8px var(--frame-c,#000);
}
.page-frame.frame-corners{
  background:
    linear-gradient(var(--frame-c),var(--frame-c)) top right/30px 2px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) top right/2px 30px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) top left/30px 2px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) top left/2px 30px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) bottom right/30px 2px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) bottom right/2px 30px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) bottom left/30px 2px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) bottom left/2px 30px no-repeat;
}
.page-frame.frame-thin-solid{
  border:0.5px solid var(--frame-c,#000);
}
.page-frame.frame-thin-double{
  border:1px solid var(--frame-c,#000);
  box-shadow:
    inset 0 0 0 2px transparent,
    inset 0 0 0 3px var(--frame-c,#000);
}
.page-frame.frame-top-bottom{
  border-top:3px solid var(--frame-c,#000);
  border-bottom:3px solid var(--frame-c,#000);
}
.page-frame.frame-left-right{
  border-left:3px solid var(--frame-c,#000);
  border-right:3px solid var(--frame-c,#000);
}

/* ============================================================
   Page Content
   ============================================================ */
.page-content{
  position:relative;z-index:2;
  display:flex;flex-direction:column;
  flex:1;min-height:0;
}
.page-main{flex:1;min-height:0;}

/* ============================================================
   Watermark
   ============================================================ */
.watermark{
  position:absolute;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;overflow:hidden;
}
.watermark-text{
  font-weight:bold;white-space:nowrap;
}
.watermark-img{
  max-width:80%;max-height:80%;
  object-fit:contain;
}

/* ============================================================
   Zoom Controls
   ============================================================ */
.zoom-ctrl{
  position:fixed;
  bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));
  left:16px;z-index:99;
  display:flex;align-items:center;gap:4px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:30px;
  padding:5px;
  box-shadow:var(--shadow-lg);
  animation:fadeInUp .55s var(--ease) .2s backwards;
}
.zoom-ctrl button{
  width:36px;height:36px;
  border-radius:50%;border:none;
  background:transparent;
  color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:18px;font-weight:700;
  padding:0;
  transition:all .25s var(--ease-bounce);
}
.zoom-ctrl button:hover{
  background:var(--accent-light);
  color:var(--accent);
  transform:scale(1.15);
}
.zoom-ctrl button:active{transform:scale(.9);}
.zoom-ctrl .pct{
  font-size:12px;font-weight:800;
  min-width:48px;text-align:center;
  color:var(--text-1);padding:0 4px;
}
@media print{.zoom-ctrl{display:none !important;}}

/* ============================================================
   Page Header (top of paper)
   ============================================================ */
.page-header{margin-bottom:4px;}
.header-grid{
  display:grid;
  grid-template-columns:1fr 1.5fr 1fr;
  gap:8px;
  align-items:start;
}
.hcol{
  display:flex;flex-direction:column;
  gap:2px;min-width:0;
}
.hcol-right{
  text-align:right;
  align-items:flex-end;
}
.hcol-center{
  text-align:center;
  align-items:center;
}
.hcol-left{
  text-align:left;
  align-items:flex-start;
}
.hfield{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.3;
  width:100%;
}
.hcol-right .hfield{text-align:right;}
.hcol-center .hfield{text-align:center;}
.hcol-left .hfield{text-align:left;}
.header-extra{
  text-align:center;margin-top:3px;
  white-space:pre-wrap;overflow-wrap:anywhere;
  line-height:1.3;
}
.header-line{margin:5px 0 4px 0;}
.header-note{
  white-space:pre-wrap;overflow-wrap:anywhere;
  margin-bottom:5px;line-height:1.5;
}

/* ============================================================
   Questions in paper
   ============================================================ */
.q-item{
  margin-bottom:8px;
  overflow-wrap:anywhere;
  page-break-inside:avoid;
  break-inside:avoid;
}
.q-head-row{
  display:flex;justify-content:space-between;
  align-items:baseline;gap:8px;
  margin-bottom:2px;flex-wrap:nowrap;
}
.q-title-el{
  flex:1 1 auto;min-width:0;
  overflow-wrap:anywhere;
}
.q-points-el{
  flex:0 0 auto;white-space:nowrap;
}
.q-desc-el{
  white-space:normal;
  overflow-wrap:anywhere;
}
.q-desc-el p{margin:0 0 3px;}
.q-desc-el strong{font-weight:900;}
.q-desc-el em{font-style:italic;}
.q-desc-el u{text-decoration:underline;}
.q-desc-el s{text-decoration:line-through;opacity:.7;}
.q-image{
  display:block;margin-top:6px;
  max-width:60%;max-height:55mm;
  object-fit:contain;border-radius:4px;
}

/* ============================================================
   Answer items in answer page
   ============================================================ */
.ans-item{
  margin-bottom:10px;
  overflow-wrap:anywhere;
  page-break-inside:avoid;
  break-inside:avoid;
}
.ans-title{
  font-weight:bold;
  margin-bottom:3px;
  overflow-wrap:anywhere;
}
.ans-text{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
