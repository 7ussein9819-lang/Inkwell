<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inkwell — Question Paper Builder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inkwell">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* ============================================================
   Inkwell — Modern Design System
   ============================================================ */
:root{
  --bg-0:#eef2f9;
  --bg-1:#ffffff;
  --bg-2:#f7f9fc;
  --bg-3:#e4eaf3;
  --glass:rgba(255,255,255,.72);
  --text-1:#0a1020;
  --text-2:#475569;
  --text-3:#94a3b8;
  --border:#e5eaf2;
  --border-strong:#cbd5e1;
  --accent:#0d9488;
  --accent-hover:#0f766e;
  --accent-light:#f0fdfa;
  --accent-ring:rgba(13,148,136,.18);
  --accent-glow:rgba(13,148,136,.32);
  --accent-gradient:linear-gradient(135deg,#0d9488,#14b8a6);
  --success:#10b981;
  --success-light:#d1fae5;
  --danger:#ef4444;
  --danger-light:#fee2e2;
  --warning:#f59e0b;
  --warning-light:#fef3c7;
  --shadow-xs:0 1px 2px rgba(11,18,32,.04);
  --shadow-sm:0 1px 3px rgba(11,18,32,.06),0 1px 2px rgba(11,18,32,.04);
  --shadow:0 4px 16px rgba(11,18,32,.08);
  --shadow-md:0 8px 24px rgba(11,18,32,.10);
  --shadow-lg:0 16px 40px rgba(11,18,32,.14);
  --shadow-xl:0 24px 60px rgba(11,18,32,.18);
  --shadow-paper:0 14px 50px rgba(11,18,32,.16);
  --radius-sm:10px;
  --radius:14px;
  --radius-lg:20px;
  --radius-xl:26px;
  --nav-h:68px;
  --topbar-h:62px;
  --font:"Arial","Segoe UI","Tahoma",sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-bounce:cubic-bezier(.68,-.55,.27,1.55);
  --ease-smooth:cubic-bezier(.25,.8,.25,1);
}
html[data-theme="dark"]{
  --bg-0:#050810;
  --bg-1:#0d1526;
  --bg-2:#182135;
  --bg-3:#273147;
  --glass:rgba(13,21,38,.72);
  --text-1:#f1f5f9;
  --text-2:#cbd5e1;
  --text-3:#64748b;
  --border:#1a2338;
  --border-strong:#2f3a52;
  --accent:#14b8a6;
  --accent-hover:#0d9488;
  --accent-light:#042f2e;
  --accent-ring:rgba(20,184,166,.24);
  --accent-glow:rgba(20,184,166,.45);
  --accent-gradient:linear-gradient(135deg,#14b8a6,#0d9488);
  --success-light:#064e3b;
  --danger-light:#7f1d1d;
  --warning-light:#78350f;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.5);
  --shadow:0 4px 16px rgba(0,0,0,.45);
  --shadow-md:0 8px 24px rgba(0,0,0,.5);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --shadow-xl:0 24px 60px rgba(0,0,0,.65);
  --shadow-paper:0 14px 50px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;transition:background-color .3s var(--ease),color .3s var(--ease);}
body{
  background:var(--bg-0);color:var(--text-1);
  font-family:var(--font);font-size:14px;min-height:100vh;
  padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font-family:inherit;color:inherit;}

/* ============================================================
   Animations
   ============================================================ */
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-24px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.92);}
  to{opacity:1;transform:scale(1);}
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%,60%{transform:translateX(-6px);}
  40%,80%{transform:translateX(6px);}
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.06);opacity:.85;}
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}
@keyframes ripple{
  to{transform:scale(4);opacity:0;}
}
@keyframes spinSlow{
  to{transform:rotate(360deg);}
}
@keyframes shimmer{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 0 var(--accent-glow);}
  50%{box-shadow:0 0 0 12px transparent;}
}
@keyframes bounceIn{
  0%{opacity:0;transform:scale(.3);}
  50%{opacity:1;transform:scale(1.05);}
  70%{transform:scale(.95);}
  100%{transform:scale(1);}
}
@keyframes slideInRight{
  from{opacity:0;transform:translateX(30px);}
  to{opacity:1;transform:translateX(0);}
}

/* ============================================================
   Topbar — Modern Glass
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--glass);
  border-bottom:1px solid var(--border);
  height:var(--topbar-h);
  padding:0 14px;
  display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  animation:slideDown .45s var(--ease);
}
.brand{
  display:flex;align-items:center;gap:11px;
  margin-inline-end:auto;min-width:0;
}
.brand-icon{
  width:38px;height:38px;flex:0 0 38px;
  border-radius:12px;
  background:var(--accent-gradient);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
  box-shadow:0 6px 18px var(--accent-glow);
  transition:transform .35s var(--ease-bounce);
}
.brand-icon:hover{
  transform:scale(1.1) rotate(-8deg);
}
.brand-text{min-width:0;}
.brand-text b{
  display:block;font-size:14px;font-weight:800;
  letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-text small{
  display:block;font-size:11px;color:var(--text-3);
  font-weight:500;margin-top:1px;
}
.tg-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;
  border-radius:20px;
  background:linear-gradient(135deg,#229ED9,#1a7bb0);
  color:#fff;font-size:10.5px;font-weight:700;
  text-decoration:none;flex:0 0 auto;
  letter-spacing:.2px;
  margin-inline-end:4px;
  box-shadow:0 3px 10px rgba(34,158,217,.4);
  transition:all .3s var(--ease-bounce);
}
.tg-badge:hover{
  transform:translateY(-2px) scale(1.05);
  box-shadow:0 6px 18px rgba(34,158,217,.55);
}
.tg-badge svg{width:12px;height:12px;fill:#fff;}
@media (max-width:420px){
  .tg-badge span{display:none;}
  .tg-badge{padding:6px;}
}
.topbar-actions{
  display:flex;gap:6px;align-items:center;
}
.icon-btn{
  width:38px;height:38px;
  border:1px solid transparent;
  border-radius:11px;
  background:transparent;
  color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 auto;
  padding:0;
  transition:all .25s var(--ease);
  position:relative;overflow:hidden;
}
.icon-btn:hover{
  background:var(--bg-2);
  color:var(--accent);
  border-color:var(--border);
  transform:translateY(-2px);
}
.icon-btn:active{transform:scale(.9);}
.icon-btn svg{
  width:20px;height:20px;display:block;
  transition:transform .25s var(--ease);
}
.icon-btn:hover svg{transform:scale(1.1);}
html[data-theme="light"] .icon-btn .icon-dark{display:none;}
html[data-theme="dark"] .icon-btn .icon-light{display:none;}

/* Auth button state */
.auth-btn.logged-in{color:var(--success);}
.auth-btn.logged-in::after{
  content:'';
  position:absolute;top:7px;right:7px;
  width:8px;height:8px;
  background:var(--success);
  border-radius:50%;
  box-shadow:0 0 0 2px var(--bg-1);
  animation:pulse 2s infinite;
}

/* ============================================================
   Menu dropdown
   ============================================================ */
.menu-wrap{position:relative;}
.menu{
  position:absolute;
  top:calc(100% + 10px);left:0;
  background:var(--bg-1);
  color:var(--text-1);
  min-width:240px;
  border-radius:var(--radius);
  box-shadow:var(--shadow-xl);
  border:1px solid var(--border);
  padding:6px;
  display:none;z-index:200;
}
.menu.open{
  display:block;
  animation:scaleIn .22s var(--ease-bounce);
  transform-origin:top left;
}
.menu button{
  width:100%;text-align:right;
  border:none;background:transparent;
  padding:11px 13px;
  border-radius:9px;
  font-size:13px;font-weight:500;
  cursor:pointer;color:var(--text-1);
  display:flex;align-items:center;gap:11px;
  transition:all .18s var(--ease);
}
.menu button:hover{
  background:var(--bg-2);
  transform:translateX(-4px);
}
.menu button.danger{color:var(--danger);}
.menu button.danger:hover{background:var(--danger-light);}
.menu hr{
  border:none;
  border-top:1px solid var(--border);
  margin:5px 0;
}
.menu .mi{
  font-size:16px;width:20px;
  text-align:center;
  display:inline-flex;
  align-items:center;justify-content:center;
}

/* ============================================================
   Main content
   ============================================================ */
main{
  padding:16px 12px;
  max-width:100%;
  overflow-x:hidden;
}
.view{display:none;}
.view.active{
  display:block;
  animation:fadeInUp .45s var(--ease);
}

/* ============================================================
   Bottom Navigation — Modern
   ============================================================ */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--glass);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;align-items:stretch;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  z-index:150;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  min-height:var(--nav-h);
}
.navbtn{
  flex:1;
  border:none;background:transparent;
  color:var(--text-3);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:5px;
  padding:8px 4px;
  border-radius:12px;
  cursor:pointer;
  font-size:11px;font-weight:700;
  min-width:0;position:relative;
  transition:all .28s var(--ease);
}
.navbtn svg{
  width:22px;height:22px;
  stroke:currentColor;fill:none;
  transition:all .32s var(--ease-bounce);
}
.navbtn:hover{color:var(--accent);}
.navbtn:hover svg{
  transform:scale(1.15) translateY(-2px);
}
.navbtn.active{color:var(--accent);}
.navbtn.active svg{transform:scale(1.1);}
.navbtn.active::before{
  content:'';
  position:absolute;top:0;left:50%;
  transform:translateX(-50%);
  width:36px;height:3px;
  background:var(--accent-gradient);
  border-radius:0 0 3px 3px;
  animation:slideDown .3s var(--ease-bounce);
}
@media (min-width:900px){
  .bottomnav{
    max-width:780px;margin:0 auto;
    left:50%;transform:translateX(-50%);
    right:auto;
    border-radius:22px 22px 0 0;
    border:1px solid var(--border);
    border-bottom:none;
  }
}

/* ============================================================
   Preview Area
   ============================================================ */
.preview-outer{position:relative;}
.preview-wrap{
  display:flex;flex-direction:column;
  align-items:center;gap:22px;
  padding:10px 0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.page-scaler{
  position:relative;flex:0 0 auto;
  animation:fadeInUp .55s var(--ease);
}

/* A4 Paper */
.page{
  width:210mm;height:297mm;
  background:#ffffff;
  color:#111827;
  padding:8mm 12mm 12mm;
  position:absolute;top:0;left:0;
  transform-origin:top right;
  box-shadow:var(--shadow-paper);
  display:flex;flex-direction:column;
  font-size:12pt;line-height:1.5;
  overflow:hidden;
  transition:box-shadow .35s var(--ease);
  border-radius:2px;
}
.page:hover{
  box-shadow:0 20px 70px rgba(11,18,32,.22);
}

/* ============================================================
   Frames — 16 different styles
   ============================================================ */
.page-frame{
  position:absolute;inset:5mm;
  pointer-events:none;z-index:3;
}
.page-frame.frame-none{display:none;}
.page-frame.frame-solid{
  border:1.5px solid var(--frame-c,#000);
}
.page-frame.frame-double{
  border:4px double var(--frame-c,#000);
}
.page-frame.frame-dashed{
  border:2px dashed var(--frame-c,#000);
}
.page-frame.frame-dotted{
  border:2px dotted var(--frame-c,#000);
}
.page-frame.frame-thick{
  border:5px solid var(--frame-c,#000);
}
.page-frame.frame-elegant{
  border:1px solid var(--frame-c,#000);
  outline:3px solid var(--frame-c,#000);
  outline-offset:3px;
}
.page-frame.frame-rounded{
  border:2px solid var(--frame-c,#000);
  border-radius:14px;
}
.page-frame.frame-double-thin{
  border:1px solid var(--frame-c,#000);
  box-shadow:
    inset 0 0 0 4px transparent,
    inset 0 0 0 5px var(--frame-c,#000);
}
.page-frame.frame-ornate::before,
.page-frame.frame-ornate::after{
  content:'';
  position:absolute;inset:0;
  border:3px solid var(--frame-c,#000);
}
.page-frame.frame-ornate::before{
  inset:6px;border-width:1px;
}
.page-frame.frame-triple{
  border:1px solid var(--frame-c,#000);
  box-shadow:
    0 0 0 3px transparent,
    0 0 0 4px var(--frame-c,#000),
    0 0 0 7px transparent,
    0 0 0 8px var(--frame-c,#000);
}
.page-frame.frame-corners{
  background:
    linear-gradient(var(--frame-c),var(--frame-c)) top right/30px 2px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) top right/2px 30px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) top left/30px 2px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) top left/2px 30px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) bottom right/30px 2px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) bottom right/2px 30px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) bottom left/30px 2px no-repeat,
    linear-gradient(var(--frame-c),var(--frame-c)) bottom left/2px 30px no-repeat;
}
.page-frame.frame-thin-solid{
  border:0.5px solid var(--frame-c,#000);
}
.page-frame.frame-thin-double{
  border:1px solid var(--frame-c,#000);
  box-shadow:
    inset 0 0 0 2px transparent,
    inset 0 0 0 3px var(--frame-c,#000);
}
.page-frame.frame-top-bottom{
  border-top:3px solid var(--frame-c,#000);
  border-bottom:3px solid var(--frame-c,#000);
}
.page-frame.frame-left-right{
  border-left:3px solid var(--frame-c,#000);
  border-right:3px solid var(--frame-c,#000);
}

/* ============================================================
   Page Content
   ============================================================ */
.page-content{
  position:relative;z-index:2;
  display:flex;flex-direction:column;
  flex:1;min-height:0;
}
.page-main{flex:1;min-height:0;}

/* ============================================================
   Watermark
   ============================================================ */
.watermark{
  position:absolute;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;overflow:hidden;
}
.watermark-text{
  font-weight:bold;white-space:nowrap;
}
.watermark-img{
  max-width:80%;max-height:80%;
  object-fit:contain;
}

/* ============================================================
   Zoom Controls
   ============================================================ */
.zoom-ctrl{
  position:fixed;
  bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));
  left:16px;z-index:99;
  display:flex;align-items:center;gap:4px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:30px;
  padding:5px;
  box-shadow:var(--shadow-lg);
  animation:fadeInUp .55s var(--ease) .2s backwards;
}
.zoom-ctrl button{
  width:36px;height:36px;
  border-radius:50%;border:none;
  background:transparent;
  color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:18px;font-weight:700;
  padding:0;
  transition:all .25s var(--ease-bounce);
}
.zoom-ctrl button:hover{
  background:var(--accent-light);
  color:var(--accent);
  transform:scale(1.15);
}
.zoom-ctrl button:active{transform:scale(.9);}
.zoom-ctrl .pct{
  font-size:12px;font-weight:800;
  min-width:48px;text-align:center;
  color:var(--text-1);padding:0 4px;
}
@media print{.zoom-ctrl{display:none !important;}}

/* ============================================================
   Page Header (top of paper)
   ============================================================ */
.page-header{margin-bottom:4px;}
.header-grid{
  display:grid;
  grid-template-columns:1fr 1.5fr 1fr;
  gap:8px;
  align-items:start;
}
.hcol{
  display:flex;flex-direction:column;
  gap:2px;min-width:0;
}
.hcol-right{
  text-align:right;
  align-items:flex-end;
}
.hcol-center{
  text-align:center;
  align-items:center;
}
.hcol-left{
  text-align:left;
  align-items:flex-start;
}
.hfield{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.3;
  width:100%;
}
.hcol-right .hfield{text-align:right;}
.hcol-center .hfield{text-align:center;}
.hcol-left .hfield{text-align:left;}
.header-extra{
  text-align:center;margin-top:3px;
  white-space:pre-wrap;overflow-wrap:anywhere;
  line-height:1.3;
}
.header-line{margin:5px 0 4px 0;}
.header-note{
  white-space:pre-wrap;overflow-wrap:anywhere;
  margin-bottom:5px;line-height:1.5;
}

/* ============================================================
   Questions in paper
   ============================================================ */
.q-item{
  margin-bottom:8px;
  overflow-wrap:anywhere;
  page-break-inside:avoid;
  break-inside:avoid;
}
.q-head-row{
  display:flex;justify-content:space-between;
  align-items:baseline;gap:8px;
  margin-bottom:2px;flex-wrap:nowrap;
}
.q-title-el{
  flex:1 1 auto;min-width:0;
  overflow-wrap:anywhere;
}
.q-points-el{
  flex:0 0 auto;white-space:nowrap;
}
.q-desc-el{
  white-space:normal;
  overflow-wrap:anywhere;
}
.q-desc-el p{margin:0 0 3px;}
.q-desc-el strong{font-weight:900;}
.q-desc-el em{font-style:italic;}
.q-desc-el u{text-decoration:underline;}
.q-desc-el s{text-decoration:line-through;opacity:.7;}
.q-image{
  display:block;margin-top:6px;
  max-width:60%;max-height:55mm;
  object-fit:contain;border-radius:4px;
}

/* ============================================================
   Answer items in answer page
   ============================================================ */
.ans-item{
  margin-bottom:10px;
  overflow-wrap:anywhere;
  page-break-inside:avoid;
  break-inside:avoid;
}
.ans-title{
  font-weight:bold;
  margin-bottom:3px;
  overflow-wrap:anywhere;
}
.ans-text{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/* ============================================================
   Math Formulas
   ============================================================ */
.math-frac{
  display:inline-flex;flex-direction:column;
  vertical-align:-0.55em;
  text-align:center;
  font-size:0.9em;line-height:1.05;
  margin:0 3px;
}
.math-frac .mf-num{
  border-bottom:1.4px solid currentColor;
  padding:0 5px;
}
.math-frac .mf-den{padding:0 5px;}
.math-root{
  display:inline-flex;align-items:flex-start;
  vertical-align:-0.15em;margin:0 2px;
}
.math-root .mr-sym{font-size:1.25em;line-height:1;}
.math-root .mr-content{
  border-top:1.4px solid currentColor;
  padding:1px 5px 0 3px;
  margin-top:0.1em;min-width:14px;
}
.math-matrix{
  display:inline-table;vertical-align:middle;
  margin:2px 4px;padding:2px 6px;
  position:relative;
}
.math-matrix::before,
.math-matrix::after{
  content:'';position:absolute;
  top:0;bottom:0;width:5px;
  border:1.5px solid currentColor;
}
.math-matrix::before{
  left:0;border-left:none;
  border-radius:0 3px 3px 0;
}
.math-matrix::after{
  right:0;border-right:none;
  border-radius:3px 0 0 3px;
}
.math-matrix table{
  border-collapse:separate;
  border-spacing:8px 2px;
}
.math-matrix td{
  text-align:center;
  min-width:16px;padding:1px 4px;
}
.math-lim{
  display:inline-flex;flex-direction:column;
  align-items:center;
  vertical-align:middle;
  margin:0 4px;line-height:1.05;
}
.math-lim .ml-lim{
  font-size:0.8em;font-style:italic;
}
.math-lim .ml-sub{
  font-size:0.6em;margin-top:-2px;
}

/* ============================================================
   Shapes — with editable labels
   ============================================================ */
.shape-block{
  position:relative;
  display:inline-block;
  vertical-align:middle;
  margin:6px 4px;
  user-select:none;
  -webkit-user-select:none;
  transition:box-shadow .15s;
  max-width:100%;
}
.shape-block svg{
  display:block;width:100%;height:100%;
  pointer-events:none;
}

/* Position modes */
.shape-block[data-float="inline"]{
  display:inline-block;
  margin:6px 4px;float:none;
}
.shape-block[data-float="left"]{
  display:block !important;
  float:none !important;
  margin:8px auto 8px 0 !important;
}
.shape-block[data-float="center"]{
  display:block !important;
  float:none !important;
  margin:8px auto !important;
}
.shape-block[data-float="right"]{
  display:block !important;
  float:none !important;
  margin:8px 0 8px auto !important;
}
.shape-block.selected{
  box-shadow:0 0 0 2px var(--accent);
  border-radius:3px;
}

/* Labels on shapes */
.shape-lbl{
  position:absolute;
  text-align:center;
  font-family:inherit;
  color:inherit;
  font-weight:bold;
  padding:0;line-height:1.1;
  box-sizing:border-box;
}
input.shape-lbl{
  background:rgba(255,255,255,.85);
  border:1px dashed rgba(13,148,136,.55);
  border-radius:3px;
  outline:none;
  width:30px;height:16px;
  padding:0 2px;
  font-size:11px;
  -webkit-appearance:none;
  appearance:none;
}
input.shape-lbl::placeholder{
  color:rgba(0,0,0,.25);
  font-size:9px;
}
input.shape-lbl:focus{
  border-color:var(--accent);
  border-style:solid;
  background:#fff;
  z-index:5;
  box-shadow:0 0 0 2px var(--accent-ring);
}
.q-desc-el .shape-lbl{
  background:transparent;
  border:none;
  color:inherit;
}

/* ============================================================
   Content Tables
   ============================================================ */
.content-table{
  border-collapse:collapse;
  margin:6px 0;width:100%;
  font-family:inherit;font-size:0.95em;
}
.content-table td,
.content-table th{
  border:1px solid currentColor;
  padding:4px 8px;
  text-align:center;
  min-width:30px;
}
.content-table th{
  font-weight:bold;
  background:rgba(13,148,136,.06);
}

/* ============================================================
   Page Footer
   ============================================================ */
.page-footer{
  margin-top:auto;
  padding-top:10px;
  display:flex;flex-direction:column;
  gap:5px;
}
.footer-wish{
  text-align:center;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.footer-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  align-items:end;
}
.footer-grid .fcol{
  min-width:0;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.footer-grid .fcol.right{text-align:right;}
.footer-grid .fcol.center{text-align:center;}
.footer-grid .fcol.left{text-align:left;}
.footer-teachers{
  display:flex;flex-direction:column;gap:1px;
}

/* ============================================================
   Tabs (Sub-navigation)
   ============================================================ */
.subtabs{
  display:flex;gap:5px;
  overflow-x:auto;
  padding:5px;
  background:var(--bg-1);
  border-radius:var(--radius);
  border:1px solid var(--border);
  margin-bottom:14px;
  scrollbar-width:none;
  box-shadow:var(--shadow-sm);
}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{
  flex:1 0 auto;
  border:none;background:transparent;
  color:var(--text-2);
  padding:10px 14px;
  border-radius:9px;
  cursor:pointer;
  font-size:12.5px;font-weight:700;
  white-space:nowrap;
  display:flex;align-items:center;
  gap:6px;justify-content:center;
  transition:all .28s var(--ease);
}
.subtab:hover{
  background:var(--bg-2);
  color:var(--accent);
  transform:translateY(-1px);
}
.subtab:active{transform:scale(.95);}
.subtab.active{
  background:var(--accent-gradient);
  color:#fff;
  box-shadow:0 6px 16px var(--accent-glow);
  transform:translateY(-1px);
}
.subtab .em{font-size:14px;}

.subview{display:none;}
.subview.active{
  display:block;
  animation:fadeInUp .35s var(--ease);
}

/* ============================================================
   Cards
   ============================================================ */
.card{
  background:var(--bg-1);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--border);
  transition:box-shadow .35s var(--ease);
  animation:fadeInUp .45s var(--ease) backwards;
}
.card:hover{box-shadow:var(--shadow);}
.card h3{
  margin:0 0 14px;
  font-size:14px;
  display:flex;align-items:center;gap:9px;
  font-weight:800;
  letter-spacing:-.1px;
}
.card h3 .em{font-size:16px;}
.card .hint{
  margin:10px 0 0;
  font-size:11.5px;
  color:var(--text-3);
  line-height:1.75;
}

/* ============================================================
   Field Groups
   ============================================================ */
.field-group{
  display:flex;flex-direction:column;
  gap:5px;
  padding:12px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  margin-bottom:9px;
  background:var(--bg-2);
  transition:all .28s var(--ease);
}
.field-group:focus-within{
  border-color:var(--accent);
  background:var(--bg-1);
  box-shadow:0 0 0 3px var(--accent-ring);
  transform:translateY(-1px);
}
.field-group > label{
  font-size:11.5px;
  font-weight:700;
  color:var(--text-2);
}
.field-group input[type="text"],
.field-group input[type="number"],
.field-group input[type="email"],
.field-group input[type="password"],
.field-group select{
  border:1.5px solid var(--border-strong);
  border-radius:8px;
  padding:9px 11px;
  font-size:13px;
  background:var(--bg-1);
  outline:none;
  width:100%;
  color:var(--text-1);
  transition:all .22s var(--ease);
}
.field-group input:focus,
.field-group select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-ring);
}

/* ============================================================
   Font Row (font, size, weight, color)
   ============================================================ */
.font-row{
  display:grid;
  grid-template-columns:1.5fr 55px 80px 40px;
  gap:6px;
  margin-top:5px;
}
.font-row.with-lh{
  grid-template-columns:1.3fr 50px 75px 38px 48px;
}
.font-row select,
.font-row input[type="number"]{
  border:1.5px solid var(--border-strong);
  border-radius:8px;
  padding:7px 6px;
  font-size:12px;
  background:var(--bg-1);
  outline:none;
  width:100%;min-width:0;
  color:var(--text-1);
}
.font-row select:focus,
.font-row input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-ring);
}
.font-row input[type="color"]{
  border:1.5px solid var(--border-strong);
  border-radius:8px;
  padding:2px;
  background:var(--bg-1);
  width:100%;min-height:32px;
  cursor:pointer;
}
.font-row input[type="color"]::-webkit-color-swatch-wrapper{padding:0;}
.font-row input[type="color"]::-webkit-color-swatch{
  border:none;border-radius:6px;
}
@media (max-width:520px){
  .font-row{grid-template-columns:1fr 48px 68px 36px;}
  .font-row.with-lh{grid-template-columns:1.2fr 46px 66px 34px 44px;}
}

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  border:none;
  border-radius:10px;
  padding:10px 15px;
  font-size:13px;font-weight:700;
  cursor:pointer;color:#fff;
  display:inline-flex;align-items:center;
  gap:7px;
  transition:all .28s var(--ease);
  position:relative;overflow:hidden;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.15);
}
.btn:active{transform:scale(.96);}
.btn.blue{background:var(--accent-gradient);}
.btn.green{background:linear-gradient(135deg,#10b981,#059669);}
.btn.red{background:linear-gradient(135deg,#ef4444,#dc2626);}
.btn.ghost{
  background:var(--bg-2);
  color:var(--text-1);
  border:1px solid var(--border);
}
.btn.ghost:hover{background:var(--bg-3);}
.btn.sm{padding:7px 11px;font-size:12px;}

/* Ripple effect */
.ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.6);
  transform:scale(0);
  animation:ripple .65s linear;
  pointer-events:none;
}

/* ============================================================
   Toggle Row
   ============================================================ */
.toggle-row{
  display:flex;align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  margin-bottom:9px;
  background:var(--bg-2);
  font-size:13px;
  cursor:pointer;
  user-select:none;
  transition:all .22s var(--ease);
}
.toggle-row:hover{
  background:var(--bg-1);
  transform:translateX(-2px);
}
.toggle-row input[type="checkbox"]{
  width:18px;height:18px;
  accent-color:var(--accent);
  cursor:pointer;
}

/* ============================================================
   Question Cards (editor)
   ============================================================ */
.q-card{
  background:var(--bg-1);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
  transition:all .32s var(--ease);
  animation:fadeInUp .4s var(--ease) backwards;
}
.q-card:hover{
  border-color:var(--accent);
  box-shadow:0 10px 30px rgba(13,148,136,.12);
  transform:translateY(-2px);
}
.q-card-head{
  display:flex;align-items:center;
  gap:9px;margin-bottom:12px;
  flex-wrap:wrap;
}
.q-card-head .num{
  font-weight:800;
  color:var(--accent);
  font-size:12px;
  padding:5px 11px;
  background:var(--accent-light);
  border-radius:20px;
}
.q-card-head .spacer{flex:1;}
.mini-btn{
  width:34px;height:34px;
  border-radius:9px;
  border:1px solid var(--border);
  background:var(--bg-2);
  color:var(--text-1);
  font-size:13px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;justify-content:center;
  padding:0;
  transition:all .25s var(--ease-bounce);
}
.mini-btn:hover{
  background:var(--bg-3);
  transform:scale(1.1);
}
.mini-btn:active{transform:scale(.9);}
.mini-btn:disabled{opacity:.35;cursor:default;}
.mini-btn.danger{color:var(--danger);}

.q-meta-item{
  display:flex;flex-direction:column;
  gap:3px;margin-bottom:9px;
}
.q-meta-item label{
  font-size:10.5px;font-weight:700;
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:.3px;
}
.q-meta-item input{
  border:1.5px solid var(--border-strong);
  border-radius:8px;
  padding:9px 11px;
  font-size:13px;
  background:var(--bg-2);
  outline:none;width:100%;
  font-family:inherit;
  color:var(--text-1);
  transition:all .22s var(--ease);
}
.q-meta-item input:focus{
  border-color:var(--accent);
  background:var(--bg-1);
  box-shadow:0 0 0 3px var(--accent-ring);
}

/* ============================================================
   Rich Text Editor
   ============================================================ */
.rich-wrap{
  border:1.5px solid var(--border-strong);
  border-radius:10px;
  background:var(--bg-1);
  overflow:visible;
  position:relative;
  transition:all .25s var(--ease);
}
.rich-wrap:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-ring);
}
.rich-toolbar{
  display:flex;flex-wrap:wrap;
  gap:4px;padding:6px;
  background:var(--bg-2);
  border-bottom:1px solid var(--border);
  align-items:center;
  border-radius:9px 9px 0 0;
}
.rich-toolbar button{
  min-width:32px;height:32px;
  padding:0 8px;
  border-radius:7px;
  border:1px solid var(--border);
  background:var(--bg-1);
  color:var(--text-2);
  font-size:13px;font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;justify-content:center;
  font-family:inherit;
  transition:all .22s var(--ease-bounce);
}
.rich-toolbar button:hover{
  background:var(--accent-light);
  color:var(--accent);
  border-color:var(--accent);
  transform:translateY(-2px);
}
.rich-toolbar button.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}
.rich-toolbar select{
  height:32px;
  padding:0 6px;
  border-radius:7px;
  border:1px solid var(--border);
  background:var(--bg-1);
  color:var(--text-2);
  font-size:12px;
  cursor:pointer;outline:none;
}
.rich-toolbar .sep{
  width:1px;height:20px;
  background:var(--border);
  margin:0 3px;
}
.rich-editor{
  min-height:80px;
  padding:12px;outline:none;
  font-family:Arial,sans-serif;
  font-size:14px;line-height:1.7;
  color:var(--text-1);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  -webkit-touch-callout:none;
  -webkit-user-select:text;
  user-select:text;
}
.rich-editor:empty::before{
  content:attr(data-placeholder);
  color:var(--text-3);
}
.rich-editor svg{vertical-align:middle;}

/* ============================================================
   Popovers (math/shapes/table)
   ============================================================ */
.popover{
  position:absolute;
  top:100%;left:0;
  margin-top:6px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  box-shadow:var(--shadow-xl);
  z-index:300;
  max-width:min(370px,94vw);
  display:none;
}
.popover.open{
  display:block;
  animation:scaleIn .22s var(--ease-bounce);
}
.popover-title{
  font-size:11px;font-weight:800;
  color:var(--text-3);
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:7px;
}
.sym-grid{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:4px;
}
.sym-grid button{
  aspect-ratio:1;
  border:1px solid var(--border);
  background:var(--bg-2);
  border-radius:6px;
  cursor:pointer;
  font-size:15px;
  color:var(--text-1);
  font-family:inherit;padding:0;
  transition:all .18s var(--ease-bounce);
}
.sym-grid button:hover{
  background:var(--accent-light);
  border-color:var(--accent);
  color:var(--accent);
  transform:scale(1.15);
}
.math-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.math-grid button{
  border:1px solid var(--border);
  background:var(--bg-2);
  border-radius:8px;
  padding:12px 6px;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
  font-size:20px;
  color:var(--text-1);
  font-family:inherit;font-weight:600;
  transition:all .22s var(--ease-bounce);
}
.math-grid button:hover{
  background:var(--accent-light);
  border-color:var(--accent);
  color:var(--accent);
  transform:translateY(-3px) scale(1.03);
}
.math-grid button span.lbl{
  font-size:10px;
  font-weight:700;
  color:var(--text-3);
}
.shapes-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.shapes-grid button{
  border:1px solid var(--border);
  background:var(--bg-2);
  border-radius:8px;
  padding:7px 4px;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;gap:4px;
  font-size:10.5px;
  color:var(--text-2);
  font-weight:600;
  font-family:inherit;
  transition:all .22s var(--ease-bounce);
}
.shapes-grid button:hover{
  background:var(--accent-light);
  border-color:var(--accent);
  color:var(--accent);
  transform:translateY(-3px) scale(1.03);
}
.popover-cats{
  display:flex;gap:4px;
  flex-wrap:wrap;margin-bottom:8px;
}
.popover-cats button{
  padding:5px 11px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--bg-2);
  font-size:11px;
  cursor:pointer;font-family:inherit;
  color:var(--text-2);font-weight:700;
  transition:all .22s var(--ease);
}
.popover-cats button:hover{transform:translateY(-1px);}
.popover-cats button.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}
.table-picker{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:3px;margin:6px 0;
}
.table-picker button{
  aspect-ratio:1;
  border:1px solid var(--border);
  background:var(--bg-2);
  border-radius:4px;
  cursor:pointer;padding:0;
  transition:all .12s;
}
.table-picker button.on{
  background:var(--accent);
  border-color:var(--accent);
  transform:scale(1.1);
}
.table-picker button:hover{background:var(--accent-light);}

/* ============================================================
   Shape toolbar (floating)
   ============================================================ */
.shape-toolbar{
  position:fixed;z-index:400;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  box-shadow:var(--shadow-xl);
  display:none;min-width:295px;
}
.shape-toolbar.open{
  display:block;
  animation:scaleIn .28s var(--ease-bounce);
}
.st-row{
  display:flex;align-items:center;
  gap:6px;margin-bottom:7px;
  flex-wrap:wrap;
}
.st-row:last-child{margin-bottom:0;}
.st-label{
  font-size:11px;font-weight:700;
  color:var(--text-3);min-width:54px;
}
.st-row input[type=range]{
  flex:1;accent-color:var(--accent);
  min-width:80px;
}
.st-row .st-value{
  font-size:11px;font-weight:800;
  color:var(--accent);
  min-width:38px;text-align:center;
}
.st-row button{
  padding:5px 9px;
  border:1px solid var(--border);
  background:var(--bg-2);
  border-radius:6px;
  font-size:11px;font-weight:700;
  cursor:pointer;
  color:var(--text-2);
  font-family:inherit;
  transition:all .22s var(--ease-bounce);
}
.st-row button:hover{
  background:var(--accent-light);
  color:var(--accent);
  border-color:var(--accent);
  transform:translateY(-1px);
}
.st-row button.on{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}
.st-row button.del{
  background:#fef2f2;
  color:var(--danger);
  border-color:#fecaca;
}
.st-divider{
  height:1px;background:var(--border);
  margin:7px 0;
}

/* ============================================================
   Context Menu
   ============================================================ */
.ctx-menu{
  position:fixed;z-index:500;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:12px;
  padding:5px;
  box-shadow:var(--shadow-xl);
  display:none;min-width:180px;
}
.ctx-menu.open{
  display:block;
  animation:scaleIn .22s var(--ease-bounce);
}
.ctx-menu button{
  width:100%;text-align:right;
  border:none;background:transparent;
  padding:9px 12px;
  border-radius:7px;
  font-size:13px;font-weight:600;
  cursor:pointer;color:var(--text-1);
  display:flex;align-items:center;
  gap:10px;font-family:inherit;
  transition:all .15s var(--ease);
}
.ctx-menu button:hover{
  background:var(--bg-2);
  transform:translateX(-4px);
}

/* ============================================================
   Misc — color dot, align, image preview
   ============================================================ */
.color-dot{
  display:inline-flex;align-items:center;
  gap:5px;padding:5px 11px;
  border:1px solid var(--border);
  background:var(--bg-1);
  border-radius:20px;
  font-size:11px;font-weight:700;
  color:var(--text-2);
  margin-top:6px;
  animation:fadeInUp .3s var(--ease);
}
.color-dot .dot{
  width:14px;height:14px;
  border-radius:50%;
  border:1px solid rgba(0,0,0,.15);
}
.align-btns{
  display:flex;gap:4px;margin-top:5px;
}
.align-btns button{
  flex:1;padding:8px;
  border:1px solid var(--border);
  background:var(--bg-2);
  border-radius:7px;
  cursor:pointer;
  font-size:12px;font-weight:700;
  color:var(--text-2);
