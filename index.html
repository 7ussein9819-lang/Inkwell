<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inkwell — Question Paper Builder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inkwell">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-0:#eef1f8; --bg-1:#ffffff; --bg-2:#f6f8fc; --bg-3:#e6ebf3;
  --text-1:#0a1020; --text-2:#475569; --text-3:#94a3b8;
  --border:#e3e8f0; --border-strong:#cad2df;
  --accent:#0d9488; --accent-hover:#0f766e;
  --accent-light:#f0fdfa; --accent-ring:rgba(13,148,136,.18);
  --accent-glow:rgba(13,148,136,.32);
  --success:#10b981; --danger:#ef4444; --danger-light:#fee2e2;
  --warning:#f59e0b;
  --shadow-xs:0 1px 2px rgba(11,18,32,.04);
  --shadow-sm:0 1px 3px rgba(11,18,32,.05),0 1px 2px rgba(11,18,32,.03);
  --shadow:0 4px 16px rgba(11,18,32,.07);
  --shadow-lg:0 16px 40px rgba(11,18,32,.13);
  --shadow-paper:0 12px 48px rgba(11,18,32,.15);
  --radius-sm:10px; --radius:14px; --radius-lg:18px;
  --nav-h:68px; --topbar-h:60px;
  --font:"Arial","Segoe UI","Tahoma",sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-bounce:cubic-bezier(.68,-.55,.27,1.55);
}
html[data-theme="dark"]{
  --bg-0:#060a14; --bg-1:#0d1526; --bg-2:#182135; --bg-3:#273147;
  --text-1:#f1f5f9; --text-2:#cbd5e1; --text-3:#64748b;
  --border:#1a2338; --border-strong:#2f3a52;
  --accent:#14b8a6; --accent-hover:#0d9488;
  --accent-light:#042f2e; --accent-ring:rgba(20,184,166,.24);
  --accent-glow:rgba(20,184,166,.4);
  --danger-light:#7f1d1d;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.5);
  --shadow:0 4px 16px rgba(0,0,0,.45);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --shadow-paper:0 12px 48px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;transition:background-color .3s var(--ease),color .3s var(--ease);}
body{
  background:var(--bg-0);color:var(--text-1);
  font-family:var(--font);font-size:14px;min-height:100vh;
  padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;color:inherit;}

/* ============ Animations ============ */
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@keyframes ripple{to{transform:scale(4);opacity:0;}}

/* ============ Topbar ============ */
.topbar{
  position:sticky;top:0;z-index:100;
  background:color-mix(in srgb, var(--bg-1) 85%, transparent);
  border-bottom:1px solid var(--border);height:var(--topbar-h);
  padding:0 12px;display:flex;align-items:center;gap:8px;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  animation:slideDown .4s var(--ease);
}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0;}
.brand-icon{
  width:36px;height:36px;flex:0 0 36px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:0 4px 14px var(--accent-glow);
  transition:transform .3s var(--ease-bounce);
}
.brand-icon:hover{transform:scale(1.1) rotate(-8deg);}
.brand-text{min-width:0;}
.brand-text b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-text small{display:block;font-size:11px;color:var(--text-3);font-weight:500;margin-top:1px;}
.tg-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:20px;
  background:linear-gradient(135deg,#229ED9,#1a7bb0);
  color:#fff;font-size:10px;font-weight:700;
  text-decoration:none;flex:0 0 auto;letter-spacing:.2px;margin-inline-end:4px;
  box-shadow:0 2px 8px rgba(34,158,217,.35);
  transition:all .3s var(--ease-bounce);
}
.tg-badge:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 6px 16px rgba(34,158,217,.5);}
.tg-badge svg{width:11px;height:11px;fill:#fff;}
@media (max-width:420px){.tg-badge span{display:none;}.tg-badge{padding:5px;}}
.topbar-actions{display:flex;gap:6px;align-items:center;}
.icon-btn{
  width:38px;height:38px;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 auto;padding:0;transition:all .2s var(--ease);
  position:relative;overflow:hidden;
}
.icon-btn:hover{background:var(--bg-2);color:var(--accent);border-color:var(--border);transform:translateY(-2px);}
.icon-btn:active{transform:scale(.9);}
.icon-btn svg{width:20px;height:20px;display:block;transition:transform .2s var(--ease);}
.icon-btn:hover svg{transform:scale(1.1);}
html[data-theme="light"] .icon-btn .icon-dark{display:none;}
html[data-theme="dark"] .icon-btn .icon-light{display:none;}

.auth-btn.logged-in{color:var(--success);}
.auth-btn.logged-in::after{
  content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;
  background:var(--success);border-radius:50%;
  box-shadow:0 0 0 2px var(--bg-1);
  animation:pulse 2s infinite;
}

.menu-wrap{position:relative;}
.menu{
  position:absolute;top:calc(100% + 8px);left:0;
  background:var(--bg-1);color:var(--text-1);min-width:230px;
  border-radius:var(--radius);box-shadow:var(--shadow-lg);
  border:1px solid var(--border);padding:6px;display:none;z-index:200;
}
.menu.open{display:block;animation:scaleIn .2s var(--ease-bounce);transform-origin:top left;}
.menu button{
  width:100%;text-align:right;border:none;background:transparent;
  padding:11px 12px;border-radius:9px;font-size:13px;font-weight:500;
  cursor:pointer;color:var(--text-1);display:flex;align-items:center;gap:10px;
  transition:all .15s var(--ease);
}
.menu button:hover{background:var(--bg-2);transform:translateX(-4px);}
.menu button.danger{color:var(--danger);}
.menu hr{border:none;border-top:1px solid var(--border);margin:4px 0;}
.menu .mi{font-size:16px;width:20px;text-align:center;display:inline-flex;align-items:center;justify-content:center;}

main{padding:14px 10px;max-width:100%;overflow-x:hidden;}
.view{display:none;}
.view.active{display:block;animation:fadeInUp .4s var(--ease);}

/* ============ Bottom nav ============ */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;
  background:color-mix(in srgb, var(--bg-1) 92%, transparent);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;align-items:stretch;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  z-index:150;backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  min-height:var(--nav-h);
}
.navbtn{
  flex:1;border:none;background:transparent;color:var(--text-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:8px 4px;border-radius:12px;cursor:pointer;
  font-size:11px;font-weight:700;min-width:0;position:relative;
  transition:all .25s var(--ease);
}
.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;transition:all .3s var(--ease-bounce);}
.navbtn:hover{color:var(--accent);}
.navbtn:hover svg{transform:scale(1.15) translateY(-2px);}
.navbtn.active{color:var(--accent);}
.navbtn.active svg{transform:scale(1.1);}
.navbtn.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:36px;height:3px;background:var(--accent);border-radius:0 0 3px 3px;
  animation:slideDown .3s var(--ease-bounce);
}
@media (min-width:900px){
  .bottomnav{max-width:760px;margin:0 auto;left:50%;transform:translateX(-50%);right:auto;border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;}
}
